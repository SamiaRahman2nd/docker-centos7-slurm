name: docker-centos7-slurm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.9']
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest
